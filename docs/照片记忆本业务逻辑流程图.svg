<text x="300.0" y="607" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">点击入口进入独立页面</text>
<rect x="70" y="660" width="460" height="105" rx="16" fill="white" stroke="#d8e2db"/>
<text x="300.0" y="701" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">记忆寻迹</text>
<text x="300.0" y="732" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">日期 ／ 心情 ／ 状态 ／ 主题 ／ 关键词</text>
<rect x="70" y="785" width="460" height="105" rx="16" fill="white" stroke="#d8e2db"/>
<text x="300.0" y="826" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">叙事时间轴</text>
<text x="300.0" y="857" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">首次 5 条 ／ 滚动加载 ／ 最近 20 条</text>
<rect x="70" y="910" width="460" height="105" rx="16" fill="white" stroke="#d8e2db"/>
<text x="300.0" y="951" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">长期副本与重要日子</text>
<text x="300.0" y="982" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">主题持续积累 ／ 日期关联</text>
<rect x="610" y="535" width="460" height="105" rx="16" fill="white" stroke="#d8e2db"/>
<text x="840.0" y="576" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">当天首次打开</text>
<text x="840.0" y="607" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">按设置筛选旧记忆</text>
<polyline points="840,640 840,660" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="840,660 834.5806795684202,648.1834452542265 845.4193204315798,648.1834452542265" fill="#538780"/>
<rect x="610" y="660" width="460" height="105" rx="16" fill="white" stroke="#d8e2db"/>
<text x="840.0" y="701" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">生成最多 3 条</text>
<text x="840.0" y="732" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">那年今日 ／ 主题 ／ 副本节点</text>
<polyline points="840,765 840,785" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="840,785 834.5806795684202,773.1834452542265 845.4193204315798,773.1834452542265" fill="#538780"/>
<rect x="610" y="785" width="460" height="105" rx="16" fill="white" stroke="#d8e2db"/>
<text x="840.0" y="826" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">打开原记忆或忽略</text>
<text x="840.0" y="857" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">支持主题、心情、单条排除</text>
<polyline points="840,890 840,910" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="840,910 834.5806795684202,898.1834452542265 845.4193204315798,898.1834452542265" fill="#538780"/>
<rect x="610" y="910" width="460" height="105" rx="16" fill="white" stroke="#d8e2db"/>
<text x="840.0" y="951" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">保存回声感言</text>
<text x="840.0" y="982" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">原记忆详情与最近 30 天历史</text>
<rect x="1150" y="535" width="460" height="105" rx="16" fill="white" stroke="#d8e2db"/>
<text x="1380.0" y="576" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">授权与周期检查</text>
<text x="1380.0" y="607" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">检查上月、上一年</text>
<polyline points="1380,640 1380,660" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="1380,660 1374.5806795684202,648.1834452542265 1385.4193204315798,648.1834452542265" fill="#538780"/>
<rect x="1150" y="660" width="460" height="105" rx="16" fill="white" stroke="#d8e2db"/>
<text x="1380.0" y="701" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">冻结真实记忆快照</text>
<text x="1380.0" y="732" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">空周期跳过 ／ 少量记录精简</text>
<polyline points="1380,765 1380,785" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="1380,785 1374.5806795684202,773.1834452542265 1385.4193204315798,773.1834452542265" fill="#538780"/>
<rect x="1150" y="785" width="460" height="105" rx="16" fill="white" stroke="#d8e2db"/>
<text x="1380.0" y="826" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">本地模板或可选 AI</text>
<text x="1380.0" y="857" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">AI 校验失败则回退模板</text>
<polyline points="1380,890 1380,910" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="1380,910 1374.5806795684202,898.1834452542265 1385.4193204315798,898.1834452542265" fill="#538780"/>
<rect x="1150" y="910" width="460" height="105" rx="16" fill="white" stroke="#d8e2db"/>
<text x="1380.0" y="951" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">提醒、播放与编辑</text>
<text x="1380.0" y="982" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">档案续播 ／ 重新生成 ／ 感言</text>
<rect x="45" y="1090" width="1590" height="155" rx="16" fill="#eaf1f8" stroke="#d8e2db"/>
<text x="70" y="1137" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#253c37">05 数据保险箱与应用锁</text>
<text x="70" y="1178" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#65776f">导出 JSON ／ ZIP 原图包 ／ PDF 记忆册    ·    导入预检 → 用户确认 → 安全合并</text>
<text x="70" y="1213" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#65776f">数据库备份状态与照片存储位置    ·    独立密码、自动锁定、恢复密钥与敏感操作验证</text>
<text x="60" y="1294" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#65776f">存储边界  PostgreSQL 保存结构数据；照片、备份和导出保存在 D 盘；重要日子与候选标签仍在浏览器。</text>
</svg>