<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1340" viewBox="0 0 1680 1340">
<rect width="1680" height="1340" fill="#f7f4ee"/>
<text x="60" y="82" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start" fill="#253c37">照片记忆本业务逻辑</text>
<text x="60" y="124" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#65776f">当前网页 MVP · 先存照片，再补文字，通过寻迹、主题、回声和情绪电影回看经历</text>
<rect x="45" y="160" width="1590" height="220" rx="16" fill="#eaf3ef" stroke="#d8e2db"/>
<text x="70" y="203" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#253c37">01 记录与主题授权</text>
<rect x="70" y="236" width="290" height="108" rx="16" fill="white" stroke="#d8e2db"/>
<text x="215.0" y="277" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">选择照片</text>
<text x="215.0" y="308" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">单张或批量导入</text>
<polyline points="360,290 382,290" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="382,290 370.1834452542265,295.41932043157976 370.1834452542265,284.58067956842024" fill="#538780"/>
<rect x="382" y="236" width="290" height="108" rx="16" fill="white" stroke="#d8e2db"/>
<text x="527.0" y="277" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">读取发生时间</text>
<text x="527.0" y="308" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">EXIF ／ 当前时间 ／ 手改</text>
<polyline points="672,290 694,290" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="694,290 682.1834452542265,295.41932043157976 682.1834452542265,284.58067956842024" fill="#538780"/>
<rect x="694" y="236" width="290" height="108" rx="16" fill="white" stroke="#d8e2db"/>
<text x="839.0" y="277" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">选择或创建主题</text>
<text x="839.0" y="308" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">批量时询问是否统一主题</text>
<polyline points="984,290 1006,290" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="1006,290 994.1834452542265,295.41932043157976 994.1834452542265,284.58067956842024" fill="#538780"/>
<rect x="1006" y="236" width="290" height="108" rx="16" fill="white" stroke="#d8e2db"/>
<text x="1151.0" y="277" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">确认长期副本</text>
<text x="1151.0" y="308" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">同意后同主题自动收集</text>
<polyline points="1296,290 1318,290" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="1318,290 1306.1834452542264,295.41932043157976 1306.1834452542264,284.58067956842024" fill="#538780"/>
<rect x="1318" y="236" width="290" height="108" rx="16" fill="white" stroke="#d8e2db"/>
<text x="1463.0" y="277" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">保存记忆</text>
<text x="1463.0" y="308" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">标题、文字、心情、状态</text>
<text x="1463.0" y="335" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">均可后补</text>
<text x="70" y="425" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#65776f">记忆保存后，各回看模块独立读取有效记录；长期副本只按主题关联，心情和状态不参与收集。</text>
<rect x="45" y="455" width="510" height="600" rx="16" fill="#eef4f0" stroke="#d8e2db"/>
<text x="70" y="506" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#253c37">02 日常回看</text>
<rect x="585" y="455" width="510" height="600" rx="16" fill="#fff7e6" stroke="#d8e2db"/>
<text x="610" y="506" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#253c37">03 记忆回声</text>
