<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1440" viewBox="0 0 1680 1440">
<rect width="1680" height="1440" fill="#f7f4ee"/>
<text x="60" y="80" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="700" text-anchor="start" fill="#253c37">情绪电影生成与回看流程</text>
<text x="60" y="123" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#65776f">基于现有实现的月度与年度总结链路</text>
<rect x="620" y="160" width="440" height="100" rx="16" fill="white" stroke="#d8e2db"/>
<text x="840.0" y="201" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">首页解锁后首次检查</text>
<text x="840.0" y="232" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">上海时区的上月与上一年</text>
<rect x="70" y="310" width="440" height="100" rx="16" fill="white" stroke="#d8e2db"/>
<text x="290.0" y="351" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">尚未授权时先询问</text>
<text x="290.0" y="382" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">文字照片默认开 ／ AI 默认关</text>
<rect x="620" y="310" width="440" height="100" rx="16" fill="white" stroke="#d8e2db"/>
<text x="840.0" y="351" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">读取用户已确认的偏好</text>
<text x="840.0" y="382" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">开启总结则继续</text>
<rect x="1170" y="310" width="440" height="100" rx="16" fill="#fff7e6" stroke="#d8e2db"/>
<text x="1390.0" y="351" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">总开关关闭</text>
<text x="1390.0" y="382" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">结束本次检查</text>
<polyline points="840,260 840,310" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="840,310 834.5806795684202,298.1834452542265 845.4193204315798,298.1834452542265" fill="#538780"/>
<polyline points="620,210 290,210 290,310" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="290,310 284.58067956842024,298.1834452542265 295.41932043157976,298.1834452542265" fill="#538780"/>
<polyline points="510,360 620,360" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="620,360 608.1834452542265,365.41932043157976 608.1834452542265,354.58067956842024" fill="#538780"/>
<polyline points="1060,360 1170,360" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="1170,360 1158.1834452542264,365.41932043157976 1158.1834452542264,354.58067956842024" fill="#538780"/>
<rect x="620" y="460" width="440" height="100" rx="16" fill="white" stroke="#d8e2db"/>
<text x="840.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">检查当前周期的任务状态</text>
<text x="840.0" y="532" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">不存在或 FAILED 则继续生成</text>
<polyline points="840,410 840,460" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="840,460 834.5806795684202,448.1834452542265 845.4193204315798,448.1834452542265" fill="#538780"/>
<rect x="1170" y="460" width="440" height="100" rx="16" fill="#eaf3ef" stroke="#d8e2db"/>
<text x="1390.0" y="501" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">复用已有结果或状态</text>
<text x="1390.0" y="532" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">READY ／ PENDING ／ GENERATING</text>
<polyline points="1060,510 1170,510" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="1170,510 1158.1834452542264,515.4193204315798 1158.1834452542264,504.58067956842024" fill="#538780"/>
<polyline points="1610,510 1640,510 1640,1110 1060,1110" fill="none" stroke="#538780" stroke-width="2" stroke-dasharray="7 7"/>
<polygon points="1060,1110 1071.8165547457736,1104.5806795684202 1071.8165547457736,1115.4193204315798" fill="#538780"/>
<rect x="620" y="610" width="440" height="100" rx="16" fill="white" stroke="#d8e2db"/>
<text x="840.0" y="651" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">读取授权范围的真实快照</text>
<text x="840.0" y="682" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">过滤已删除及被排除的记忆</text>
<polyline points="840,560 840,610" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="840,610 834.5806795684202,598.1834452542265 845.4193204315798,598.1834452542265" fill="#538780"/>
<rect x="70" y="610" width="440" height="100" rx="16" fill="#fff7e6" stroke="#d8e2db"/>
<text x="290.0" y="651" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">0 条有效记忆则停止</text>
<text x="290.0" y="682" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">重生成时删除旧总结及其感言</text>
<polyline points="620,660 510,660" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="510,660 521.8165547457735,654.5806795684202 521.8165547457735,665.4193204315798" fill="#538780"/>
<rect x="620" y="760" width="440" height="100" rx="16" fill="white" stroke="#d8e2db"/>
<text x="840.0" y="801" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">生成第二人称本地旁白</text>
<text x="840.0" y="832" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">最高频心情 ／ 无心情用鼓励句</text>
<polyline points="840,710 840,760" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="840,760 834.5806795684202,748.1834452542265 845.4193204315798,748.1834452542265" fill="#538780"/>
<rect x="1170" y="760" width="440" height="100" rx="16" fill="white" stroke="#d8e2db"/>
<text x="1390.0" y="801" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">已授权且已配置云端 AI</text>
<text x="1390.0" y="832" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">尝试整理并校验，不符则回退模板</text>
<polyline points="1060,810 1170,810" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="1170,810 1158.1834452542264,815.4193204315798 1158.1834452542264,804.5806795684202" fill="#538780"/>
<polyline points="1390,860 1390,960 1060,960" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="1060,960 1071.8165547457736,954.5806795684202 1071.8165547457736,965.4193204315798" fill="#538780"/>
<rect x="620" y="910" width="440" height="100" rx="16" fill="white" stroke="#d8e2db"/>
<text x="840.0" y="951" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">事务保存总结与故事页</text>
<text x="840.0" y="982" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">1–2 条精简版 ／ 独立快照</text>
<polyline points="840,860 840,910" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="840,910 834.5806795684202,898.1834452542265 845.4193204315798,898.1834452542265" fill="#538780"/>
<rect x="620" y="1060" width="440" height="100" rx="16" fill="white" stroke="#d8e2db"/>
<text x="840.0" y="1101" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#253c37">结果展示和用户回看</text>
<text x="840.0" y="1132" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#65776f">未读 READY 提醒 ／ 档案馆续播</text>
<polyline points="840,1010 840,1060" fill="none" stroke="#538780" stroke-width="2" />
<polygon points="840,1060 834.5806795684202,1048.1834452542264 845.4193204315798,1048.1834452542264" fill="#538780"/>
<text x="1170" y="1033" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#65776f">生成中只返回状态，不显示新总结提醒</text>
<rect x="65" y="1210" width="1550" height="128" rx="16" fill="#eaf3ef" stroke="#d8e2db"/>
<text x="90" y="1254" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#253c37">回看后的用户操作</text>
<text x="90" y="1294" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#65776f">编辑旁白、照片与页序；发生版本冲突时重新加载。非空周期重新生成保留感言，空周期删除总结及其感言。</text>
<text x="90" y="1325" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#65776f">保存月度或年度回声感言，之后在档案馆回看。修改总结不会改写原始记忆。</text>
<text x="65" y="1396" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#65776f">实现边界  删除总结、单条记忆排除和偏好更新已有 API；独立设置与删除操作入口尚待补齐。</text>
</svg>